name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis # Use the official Redis image
        ports:
          - 6379:6379 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies

      - name: Install dependencies
        run: |
          # Ensure setup.sh is executable
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Install ghz (Load Testing Tool)
        run: |
          echo "Downloading ghz..."
          # Use -f to fail on HTTP errors, keep -L for redirects, remove -s for verbose output
          curl -fSL -o ghz.tar.gz https://github.com/bojand/ghz/releases/download/v0.119.0/ghz_0.119.0_linux_amd64.tar.gz
          
          echo "Checking downloaded file type..."
          file ghz.tar.gz # See what kind of file was actually downloaded

          echo "Extracting ghz..."
          # Extract the contents of the archive into the current directory
          tar -xzf ghz.tar.gz 
          
          echo "Moving ghz to /usr/local/bin..."
          # Assuming the binary inside the archive is named 'ghz'
          sudo mv ghz /usr/local/bin/
          
          echo "Verifying ghz installation..."
          ghz --version
          
      - name: Build Protobuf files
        run: |
          # Ensure build.sh is executable
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=generated:$PYTHONPATH
          python -m unittest discover -v -s tests/unit -p 'test_*.py'
        
      - name: Run Integration Tests
        run: |
          export PYTHONPATH=generated:$PYTHONPATH
          
          # Start the server in the background
          echo "Starting server..."
          chmod +x scripts/run.sh
          # python3 -m backend_service.server &
          ./scripts/run.sh server &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to start
          echo "Waiting for server to initialize..."
          sleep 10

          # Run integration tests
          echo "Running integration tests..."
          chmod +x scripts/test.sh
          ./scripts/test.sh
          # python -m unittest discover -v -s tests/integration -p 'test_*.py' # Added -v
          TEST_EXIT_CODE=$? # Capture exit code

          # Stop the server regardless of test outcome
          echo "Stopping server..."
          kill $SERVER_PID
          # Wait a moment to ensure the process is terminated
          sleep 2

          # Exit with the test exit code
          exit $TEST_EXIT_CODE
