name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis # Use the official Redis image
        ports:
          - 6379:6379 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies

      - name: Install dependencies
        run: |
          # Ensure setup.sh is executable
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Install ghz (Load Testing Tool)
        run: |
          echo "Downloading ghz..."
          curl -fSL -o ghz.tar.gz "https://github.com/bojand/ghz/releases/download/v0.120.0/ghz-linux-x86_64.tar.gz"
          
          echo "Checking downloaded file type..."
          file ghz.tar.gz
          
          echo "Extracting ghz..."
          tar -xzf ghz.tar.gz
          
          echo "Moving ghz to /usr/local/bin..."
          sudo mv ghz /usr/local/bin/
          
          echo "Verifying ghz installation..."
          ghz --version
          
      - name: Build Protobuf files
        run: |
          # Ensure build.sh is executable
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Start gRPC Server for Load Tests
        run: |
          # export PYTHONPATH=generated:$PYTHONPATH
          # echo "Starting server for load tests..."
          # python3 -m backend_service.server &
          # SERVER_PID=$!
          # echo "Server started with PID $SERVER_PID"
          # Ensure run.sh is executable
          chmod +x scripts/run.sh
          ./scripts/run.sh server &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"
          # Wait for the server to start
          sleep 5

      - name: Run Tests - unittest, integration, and performance
        run: |
          # Ensure test.sh is executable
          chmod +x scripts/test.sh
          ./scripts/test.sh

          # Stop the server regardless of test outcome
          echo "Stopping server..."
          kill $SERVER_PID
          # Wait a moment to ensure the process is terminated
          sleep 2

          # Exit with the test exit code
          exit $TEST_EXIT_CODE
