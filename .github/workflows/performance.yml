name: Performance Tests

# on:
#   schedule:
#     # Runs daily at 2 AM UTC (adjust as needed)
#     - cron: '0 2 * * *'
#   workflow_dispatch: # Allows manual triggering from the Actions tab
on:
  pull_request:
    branches: [ main ]
    
jobs:
  performance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Build Protobuf files
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Install ghz (Load Testing Tool)
        run: |
          echo "Downloading ghz..."
          curl -fSL -o ghz.tar.gz "https://github.com/bojand/ghz/releases/download/v0.120.0/ghz-linux-x86_64.tar.gz"
          
          echo "Checking downloaded file type..."
          file ghz.tar.gz
          
          echo "Extracting ghz..."
          tar -xzf ghz.tar.gz
          
          echo "Moving ghz to /usr/local/bin..."
          sudo mv ghz /usr/local/bin/
          
          echo "Verifying ghz installation..."
          ghz --version

      - name: Run Standalone Benchmark Tests
        run: |
          export PYTHONPATH=generated:$PYTHONPATH
          python3 -m tests.perf.benchmark

      - name: Start gRPC Server for Load Tests
        run: |
          export PYTHONPATH=generated:$PYTHONPATH
          echo "Starting server for load tests..."
          python3 -m backend_service.server &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Store PID for later steps
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server - consider a more robust check
          echo "Waiting for server to initialize..."
          sleep 5

      - name: Run Stream Load Tests
        # This step depends on the server started previously
        run: |
          export PYTHONPATH=generated:$PYTHONPATH
          echo "Running stream load test..."
          python3 -m tests.perf.stream_load_test

      - name: Run ghz Load Tests (SubmitHeartRate)
        # This step also depends on the server
        run: |
          echo "Running ghz load test..."
          ghz --insecure \
              --proto proto/heartrate_service.proto \
              --call heartrate.HeartRateMonitor.SubmitHeartRate \
              -n 1000 -c 10 \
              --timeout 20s \
              -d '{"bpm": 75, "timestamp": '$(date +%s)'}' \
              localhost:50051

      - name: Stop gRPC Server
        # This step runs regardless of previous steps' success/failure
        if: always() && env.SERVER_PID
        run: |
          echo "Stopping server (PID: ${SERVER_PID})..."
          kill ${{ env.SERVER_PID }}
          sleep 2 # Give it a moment to shut down
          echo "Server stop command issued."
