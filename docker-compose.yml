version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - heartrate-network

  heartrate-service:
    build: .
    ports:
      - "${GRPC_PORT:-50051}:50051"  # gRPC server
      - "${METRICS_PORT:-8080}:8080"  # Prometheus metrics
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - heartrate-network
    volumes:
      - ./logs:/app/logs  # Map logs directory for persistence

networks:
  heartrate-network:
    driver: bridge

volumes:
  redis-data:
